<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JPhotography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Lato', sans-serif; }
    .navbar-brand { font-family: 'Playfair Display', serif; font-weight: 700; color: #222 !important; }
    .nav-link { font-size: .72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #555 !important; cursor: pointer; }
    .nav-link:hover, .nav-link.active { color: #111 !important; }
    .page { display: none; }
    .page.active { display: block; }

    .hero { text-align: center; padding: 70px 20px 40px; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: #222; }
    .hero .subtitle { color: #666; font-size: .95rem; }
    .hero .tagline { font-size: .68rem; letter-spacing: 3px; text-transform: uppercase; color: #aaa; }
    .btn-filter { font-size: .72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border: none; background: transparent; color: #888; padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all .2s; }
    .btn-filter.active, .btn-filter:hover { background: #222; color: #fff; }
    .gallery-item { overflow: hidden; position: relative; aspect-ratio: 1/1; background: #ccc; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s, filter .4s; }
    .gallery-item:hover img { transform: scale(1.07); filter: brightness(.8); }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; background: rgba(0,0,0,.25); transition: opacity .3s; }
    .gallery-item:hover .overlay { opacity: 1; }
    .overlay i { color: #fff; font-size: 1.5rem; }
    footer { text-align: center; padding: 40px 20px; border-top: 1px solid #eee; margin-top: 40px; }
    footer .brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.1rem; color: #222; }
    footer .copy { font-size: .7rem; color: #aaa; }
    footer a { color: #888; margin: 0 5px; font-size: 1rem; text-decoration: none; }
    footer a:hover { color: #222; }
    @media(max-width:768px) { .row-cols-4 { --bs-columns: 2 !important; } }

    .page-hero { text-align: center; padding: 120px 20px; }
    .page-hero h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #222; margin-bottom: 12px; }
    .page-hero p { color: #aaa; font-size: .85rem; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top px-4">
  <a class="navbar-brand" href="#" onclick="showPage('home')">JPhotography</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse justify-content-end" id="navMenu">
    <ul class="navbar-nav gap-1">
      <li class="nav-item"><a class="nav-link active" id="nav-home" onclick="showPage('home')">Home</a></li>
      <li class="nav-item"><a class="nav-link" id="nav-about" onclick="showPage('about')">About Me</a></li>
      <li class="nav-item"><a class="nav-link" id="nav-portfolio" onclick="showPage('portfolio')">Portfolio</a></li>
      <li class="nav-item"><a class="nav-link" id="nav-contact" onclick="showPage('contact')">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="page active" id="page-home">
  <div class="hero">
    <h1>Hi. Hello.. I Am Adhiem Nabil Maulana...!</h1>
    <p class="subtitle">I Travel Around The World To Get The Best Photos.!</p>
    <p class="tagline">Award Winning Photographer &nbsp;/&nbsp; Cinematographer &nbsp;/&nbsp; Writer</p>
  </div>
  <div class="d-flex justify-content-center gap-2 mb-4">
    <button class="btn-filter active" onclick="filter('all',this)">All</button>
    <button class="btn-filter" onclick="filter('landscape',this)">Landscape</button>
    <button class="btn-filter" onclick="filter('portrait',this)">Portrait</button>
    <button class="btn-filter" onclick="filter('wedding',this)">Wedding</button>
  </div>
  <div class="row row-cols-4 g-1 mx-auto" style="max-width:960px;padding:0 15px" id="gallery">
    <div class="col gallery-item" data-cat="landscape"><img src="foto1.jpeg" alt="foto1"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto2.jpeg" alt="foto2"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto3.jpeg" alt="foto3"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto4.jpeg" alt="foto4"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto5.jpeg" alt="foto5"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto6.jpeg" alt="foto6"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto7.jpeg" alt="foto7"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto8.jpeg" alt="foto8"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto9.jpeg" alt="foto9"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto10.jpeg" alt="foto10"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto11.jpeg" alt="foto11"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto12.jpeg" alt="foto12"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="portrait"><img src="foto13.jpeg" alt="foto13"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto14.jpeg" alt="foto14"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="landscape"><img src="foto15.jpeg" alt="foto15"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
    <div class="col gallery-item" data-cat="wedding"><img src="foto16.jpeg" alt="foto16"><div class="overlay"><i class="bi bi-zoom-in"></i></div></div>
  </div>
  <footer>
    <div class="brand">JPhotography</div>
    <p class="copy">© Copyright 2024. All Rights Reserved.</p>
    <a href="#"><i class="bi bi-camera"></i></a>
    <a href="#"><i class="bi bi-behance"></i></a>
    <a href="#"><i class="bi bi-instagram"></i></a>
    <a href="#"><i class="bi bi-pinterest"></i></a>
    <a href="#"><i class="bi bi-facebook"></i></a>
    <a href="#"><i class="bi bi-twitter-x"></i></a>
  </footer>
</div>

<div class="page" id="page-about">
  <div class="page-hero">
    <h1>About Me</h1>
  </div>
</div>

<div class="page" id="page-portfolio">
  <div class="page-hero">
    <h1>Portfolio</h1>
  </div>
</div>

<div class="page" id="page-contact">
  <div class="page-hero">
    <h1>Contact</h1>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');
    window.scrollTo(0, 0);
  }
  function filter(cat, btn) {
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.gallery-item').forEach(item => {
      item.style.display = (cat === 'all' || item.dataset.cat === cat) ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
